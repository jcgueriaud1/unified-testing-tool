name: Release

# mvn release:prepare pushes a tag (unified-test-<version>); this publishes that tag to
# Maven Central. Same secrets as parttio/dramafinder.
on:
  push:
    tags:
      - 'unified-test-*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_U
          server-password: CENTRAL_T
      # The demo is not published; release:prepare already ran its tests.
      - name: Publish
        run: mvn -B -ntp -Prelease deploy -pl '!unified-test-demo'
        env:
          CENTRAL_T: ${{ secrets.CENTRAL_TOKEN }}
          CENTRAL_U: ${{ secrets.CENTRAL_USER }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}

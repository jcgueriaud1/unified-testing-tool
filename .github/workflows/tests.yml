name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browserless:
    name: Browserless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests and demo tests on Browserless
        run: mvn -B -ntp install
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-browserless
          path: '**/target/surefire-reports/'

  playwright:
    name: Playwright (Dramafinder)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build without tests
        run: mvn -B -ntp install -DskipTests
      - name: Install Chromium for Playwright
        run: >
          mvn -B -ntp -pl unified-test-demo exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
      - name: Demo tests on Playwright
        run: mvn -B -ntp -pl unified-test-demo test -Dvaadin.testing.tool=playwright
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-playwright
          path: '**/target/surefire-reports/'

  selenium:
    name: Selenium (TestBench)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # TestBench checks its license when it loads (Vaadin Commercial License)
      VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_OFFLINE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build without tests
        run: mvn -B -ntp install -DskipTests
      - name: Demo tests on Selenium (installed Chrome, driver from Selenium Manager)
        run: mvn -B -ntp -pl unified-test-demo test -Dvaadin.testing.tool=selenium
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-selenium
          path: '**/target/surefire-reports/'

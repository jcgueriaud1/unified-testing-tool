---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.MigrateBrowserlessBuild
displayName: Swap Browserless Test for the Unified API in the Maven build
description: >-
  Imports unified-test-bom, adds the Browserless adapter (and the Spring integration in Spring Boot projects) as
  test dependencies, and removes direct Browserless Test and TestBench UI Unit dependencies, which the Browserless
  adapter brings in. Keeps `browserless-test-spring`, which Browserless runs of Spring tests need.
preconditions:
  - org.vaadin.addons.unified.rewrite.FindBrowserlessDependencies
recipeList:
  - org.openrewrite.maven.AddManagedDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-bom
      version: ${project.version}
      type: pom
      scope: import
  - org.openrewrite.maven.AddDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-browserless
      version: ${project.version}
      scope: test
  - org.vaadin.addons.unified.rewrite.AddSpringIntegrationToSpringBootProjects
  - org.openrewrite.maven.RemoveDependency:
      groupId: com.vaadin
      artifactId: browserless-test
  - org.openrewrite.maven.RemoveDependency:
      groupId: com.vaadin
      artifactId: browserless-test-junit*
  - org.openrewrite.maven.RemoveDependency:
      groupId: com.vaadin
      artifactId: browserless-test-shared
  - org.openrewrite.maven.RemoveDependency:
      groupId: com.vaadin
      artifactId: vaadin-testbench-unit*
---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.AddSpringIntegrationToSpringBootProjects
displayName: Add the Unified API's Spring integration to Spring Boot projects
description: Adds `unified-test-spring` as a test dependency to projects with a direct Spring Boot dependency.
preconditions:
  - org.openrewrite.maven.search.DependencyInsight:
      groupIdPattern: org.springframework.boot
      artifactIdPattern: "*"
      onlyDirect: true
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-spring
      version: ${project.version}
      scope: test
---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.AddSeleniumAdapter
displayName: Add the Unified API's Selenium adapter
description: Adds `unified-test-selenium` as a test dependency, to run Unified UI Tests on Selenium (TestBench).
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-selenium
      version: ${project.version}
      scope: test
---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.MigrateBrowserlessTestCode
displayName: Migrate Browserless test code to the Unified API
description: Rewrites the source of Browserless tests; only touches files that use Browserless Test's test base classes.
preconditions:
  - org.vaadin.addons.unified.rewrite.FindBrowserlessTests
recipeList:
  - org.vaadin.addons.unified.rewrite.BrowserlessOnlyPatterns
  - org.vaadin.addons.unified.rewrite.BrowserlessSetupToUnified
  - org.vaadin.addons.unified.rewrite.BrowserlessCallsToUnified
  - org.vaadin.addons.unified.rewrite.BrowserlessAssertionsToUnified
  - org.vaadin.addons.unified.rewrite.BrowserlessLookupsToUnified
  - org.vaadin.addons.unified.rewrite.BrowserlessGridScansToRows
  - org.vaadin.addons.unified.rewrite.BrowserlessLeftoversToEscapeHatch
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.test.context.SpringBootTest
      newFullyQualifiedTypeName: com.vaadin.testing.unified.spring.UnifiedSpringBootTest
  - org.openrewrite.java.RemoveUnusedImports
---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.MigrateUIUnitToBrowserless
displayName: Move TestBench UI Unit tests to Browserless Test
description: >-
  Moves tests written with TestBench UI Unit 9.x (Vaadin 24: `UIUnitTest`, `SpringUIUnitTest`, and the JUnit 4
  `UIUnit4Test`) to their Browserless Test 25 equivalents, so the Browserless rules then apply. JUnit 4 UI Unit
  tests go through OpenRewrite's JUnit 4 test-code recipes. Component testers already have the same names; the
  HTML testers move out of `com.vaadin.flow.component.html.testbench`, whose TestBench elements stay where they are.
preconditions:
  - org.openrewrite.java.search.HasType:
      fullyQualifiedTypeName: com.vaadin.testbench.unit..*
      checkAssignability: false
recipeList:
  - org.openrewrite.java.testing.junit5.UpdateBeforeAfterAnnotations
  - org.openrewrite.java.testing.junit5.UpdateTestAnnotation
  - org.openrewrite.java.testing.junit5.AssertToAssertions
  - org.openrewrite.java.testing.junit5.IgnoreToDisabled
  - org.openrewrite.java.testing.junit5.ExpectedExceptionToAssertThrows
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.unit.UIUnitTest
      newFullyQualifiedTypeName: com.vaadin.browserless.BrowserlessTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.unit.UIUnit4Test
      newFullyQualifiedTypeName: com.vaadin.browserless.BrowserlessTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.unit.SpringUIUnitTest
      newFullyQualifiedTypeName: com.vaadin.browserless.SpringBrowserlessTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.unit.SpringUIUnit4Test
      newFullyQualifiedTypeName: com.vaadin.browserless.SpringBrowserlessTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.unit.BaseUIUnitTest
      newFullyQualifiedTypeName: com.vaadin.browserless.BaseBrowserlessTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.unit.UIUnitTestSetupException
      newFullyQualifiedTypeName: com.vaadin.browserless.BrowserlessTestSetupException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.unit.UITestSpringLookupInitializer
      newFullyQualifiedTypeName: com.vaadin.browserless.BrowserlessTestSpringLookupInitializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.flow.component.html.testbench.AnchorTester
      newFullyQualifiedTypeName: com.vaadin.flow.component.html.AnchorTester
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.flow.component.html.testbench.DescriptionListTester
      newFullyQualifiedTypeName: com.vaadin.flow.component.html.DescriptionListTester
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.flow.component.html.testbench.DivTester
      newFullyQualifiedTypeName: com.vaadin.flow.component.html.DivTester
  - org.openrewrite.java.ChangeType:

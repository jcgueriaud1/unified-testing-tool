---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.MigrateTestBenchBuild
displayName: Swap TestBench for the Unified API in the Maven build
description: >-
  Imports unified-test-bom, adds the Spring integration and the Browserless and Selenium adapters as test
  dependencies, and removes direct TestBench dependencies, which the Selenium adapter brings in.
preconditions:
  - org.openrewrite.maven.search.DependencyInsight:
      groupIdPattern: com.vaadin
      artifactIdPattern: vaadin-testbench*
      onlyDirect: true
recipeList:
  - org.openrewrite.maven.AddManagedDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-bom
      version: ${project.version}
      type: pom
      scope: import
  - org.openrewrite.maven.AddDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-spring
      version: ${project.version}
      scope: test
  - org.openrewrite.maven.AddDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-browserless
      version: ${project.version}
      scope: test
  - org.openrewrite.maven.AddDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-selenium
      version: ${project.version}
      scope: test
  - org.openrewrite.maven.RemoveDependency:
      groupId: com.vaadin
      artifactId: vaadin-testbench*
---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.MigrateTestBenchTestCode
displayName: Migrate TestBench test code to the Unified API
description: Rewrites the source of TestBench tests; only touches files that use TestBench.
preconditions:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: com.vaadin.testbench.BrowserTestBase
recipeList:
  - org.vaadin.addons.unified.rewrite.TestBenchSetupToUnified
  - org.vaadin.addons.unified.rewrite.TestBenchAssertionsToUnified
  - org.vaadin.addons.unified.rewrite.TestBenchGridCellsToUnified
  - org.vaadin.addons.unified.rewrite.TestBenchLookupsToUnified
  - org.vaadin.addons.unified.rewrite.TestBenchLeftoversToEscapeHatch
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: org.springframework.boot.test.context.SpringBootTest
      attributeName: webEnvironment
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.test.context.SpringBootTest
      newFullyQualifiedTypeName: com.vaadin.testing.unified.spring.UnifiedSpringBootTest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.vaadin.testbench.BrowserTest
      newFullyQualifiedTypeName: org.junit.jupiter.api.Test
  - org.openrewrite.java.RemoveUnusedImports
---
type: specs.openrewrite.org/v1beta/recipe
name: org.vaadin.addons.unified.rewrite.AddPlaywrightAdapter
displayName: Add the Unified API's Playwright adapter
description: Adds `unified-test-playwright` as a test dependency, to run Unified UI Tests on Playwright.
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.vaadin.addons
      artifactId: unified-test-playwright
      version: ${project.version}
      scope: test
